[project]
name = "doan-dau-research"
version = "0.0.0"
description = "Research code for Vietnamese diacritic restoration in the Ngó Sen input method"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pyarrow>=15", "huggingface_hub>=0.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# Runs and their restorations are the same length by construction.
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
